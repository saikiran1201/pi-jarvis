<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Jarvis</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --jarvis:#79c0ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#3fb950; box-shadow:0 0 8px #3fb950; }
  header b { font-size:16px; } header span { color:var(--dim); font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:#1f6feb; color:#fff; border-bottom-right-radius:4px; }
  .jarvis { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .jarvis.pending { color:var(--dim); font-style:italic; }
  form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); background:var(--panel); }
  input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:11px 14px; border-radius:10px; font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { background:#1f6feb; color:#fff; border:0; padding:11px 20px; border-radius:10px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:12px; padding:0 20px 10px; background:var(--panel); }
</style>
</head>
<body>
<header><div class="dot"></div><b>Pi Jarvis</b><span>· your personal assistant</span></header>
<div id="chat"></div>
<form id="f"><input id="i" autocomplete="off" placeholder="Talk to Jarvis…  (e.g. morning brief)"><button>Send</button></form>
<div class="hint">memory persists between launches · Ctrl+Enter not needed — Enter sends</div>
<script>
const chat = document.getElementById("chat"), form = document.getElementById("f"), input = document.getElementById("i");
function add(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
form.onsubmit = async (e) => {
  e.preventDefault();
  const msg = input.value.trim(); if (!msg) return;
  input.value = ""; add("me", msg);
  const pending = add("jarvis pending", "thinking…");
  const btn = form.querySelector("button"); btn.disabled = true;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg }) });
    const j = await r.json();
    pending.classList.remove("pending");
    pending.textContent = j.reply || j.error || "(empty reply)";
  } catch (err) { pending.classList.remove("pending"); pending.textContent = "connection error: " + err.message; }
  chat.scrollTop = chat.scrollHeight; btn.disabled = false; input.focus();
};
add("jarvis", "Good to see you. Ask me for a \"morning brief\", tell me to \"remember\" something, or just talk.");
input.focus();
</script>
</body>
</html>
